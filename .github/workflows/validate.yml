name: Validate

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - name: translations
        run: npm run i18n:check
      - run: npm run build
      # dist/ is only committed with a release (HACS reads it from the release commit), so pull requests
      # leave it alone; a release tag must point at a commit whose dist/ matches the source.
      - name: dist is up to date (release tags)
        if: startsWith(github.ref, 'refs/tags/v')
        run: git diff --exit-code -- dist/hacasa-nova.js || (echo "Run npm run build and commit dist/hacasa-nova.js before tagging" && exit 1)

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
